<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fixed Open World Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a202c;
            font-family: Arial, sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Top UI Panels */
        #ui-top-left {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.65);
            padding: 10px 14px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 12px;
            line-height: 1.5;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
        }
        /* Touch Joystick Overlay */
        #joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 204, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-top-left">
        <div>💎 Gems: <span id="gems">0/15</span></div>
        <div>☀️ Time: <span id="time">Day</span></div>
        <div>⚡ Energy: 100%</div>
    </div>

    <div id="canvas-container"></div>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <script>
        // --- SCENE & RENDERER SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a233a); // Darker blue atmosphere to fix whiteout
        scene.fog = new THREE.FogExp2(0x1a233a, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // Fixes white overexposure
        renderer.toneMappingExposure = 0.8;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- BALANCED LIGHTING (FIXES OVEREXPOSURE) ---
        const ambientLight = new THREE.AmbientLight(0xddeeff, 0.35); // Lowered ambient energy
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 0.8);
        sunLight.position.set(30, 50, 20);
        scene.add(sunLight);

        // --- GROUND / TERRAIN (CORRECTED GREEN MATERIAL) ---
        const groundGeo = new THREE.PlaneGeometry(300, 300, 32, 32);
        groundGeo.rotateX(-Math.PI / 2);
        
        // Ground material with standard lighting reflection
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x2e6f40, // Proper green ground color
            roughness: 0.8,
            metalness: 0.1
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        scene.add(ground);

        // Visual Grid overlay on terrain to make movement obvious
        const gridHelper = new THREE.GridHelper(300, 60, 0x448844, 0x225522);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // --- PLAYER AVATAR ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const bodyGeo = new THREE.CylinderGeometry(0.4, 0.5, 1.4, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00d2ff, roughness: 0.3 });
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
        bodyMesh.position.y = 0.7;
        playerGroup.add(bodyMesh);

        const hatGeo = new THREE.ConeGeometry(0.5, 0.3, 16);
        const hatMat = new THREE.MeshStandardMaterial({ color: 0x111122 });
        const hatMesh = new THREE.Mesh(hatGeo, hatMat);
        hatMesh.position.y = 1.5;
        playerGroup.add(hatMesh);

        // Third-person camera follow relative position
        camera.position.set(0, 4, 8);
        playerGroup.add(camera);
        camera.lookAt(0, 1, 0);

        // --- TOUCH JOYSTICK CONTROLS ---
        let input = { x: 0, y: 0 };
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        let activeTouchId = null;

        zone.addEventListener('touchstart', (e) => {
            activeTouchId = e.changedTouches[0].identifier;
            updateJoystick(e.changedTouches[0]);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (activeTouchId === null) return;
            for (let touch of e.changedTouches) {
                if (touch.identifier === activeTouchId) updateJoystick(touch);
            }
        }, { passive: true });

        const resetJoystick = () => {
            activeTouchId = null;
            knob.style.top = '35px';
            knob.style.left = '35px';
            input = { x: 0, y: 0 };
        };

        window.addEventListener('touchend', resetJoystick, { passive: true });
        window.addEventListener('touchcancel', resetJoystick, { passive: true });

        function updateJoystick(touch) {
            const rect = zone.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let dx = touch.clientX - cx;
            let dy = touch.clientY - cy;
            const dist = Math.min(Math.hypot(dx, dy), 40);
            const angle = Math.atan2(dy, dx);

            const mx = Math.cos(angle) * dist;
            const my = Math.sin(angle) * dist;

            knob.style.left = `${35 + mx}px`;
            knob.style.top = `${35 + my}px`;

            input.x = mx / 40;
            input.y = my / 40;
        }

        // --- MAIN LOOP ---
        const speed = 0.12;
        function animate() {
            requestAnimationFrame(animate);

            if (Math.abs(input.x) > 0.05 || Math.abs(input.y) > 0.05) {
                const moveAngle = Math.atan2(-input.x, -input.y);
                playerGroup.rotation.y = moveAngle;
                playerGroup.translateZ(-speed);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
