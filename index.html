<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile WebGL Open World</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87ceeb;
            font-family: sans-serif;
            touch-action: none; /* Prevents mobile browser scrolling */
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        /* Touch UI Overlay */
        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
        }
        #stats {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 1px 1px 2px black;
            font-size: 14px;
        }
    </style>
    <!-- Load Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="stats">Online Players: 1 | FPS: <span id="fps">60</span></div>
    <div id="canvas-container"></div>

    <!-- On-screen joystick for Android touch control -->
    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <script>
        // --- 1. SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015); // Fog hides chunk loading boundaries

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false }); // Disable MSAA for mobile speed
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Dynamic mobile resolution
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        // --- 2. PLAYER & AVATAR SETUP ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // Simple Low-Poly Player Mesh
        const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.6, 8);
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0x00ffcc });
        const playerMesh = new THREE.Mesh(bodyGeo, bodyMat);
        playerMesh.position.y = 0.8;
        playerGroup.add(playerMesh);

        camera.position.set(0, 3, 7);
        playerGroup.add(camera);
        camera.lookAt(0, 1, 0);

        // --- 3. INFINITE TERRAIN CHUNK SYSTEM ---
        const CHUNK_SIZE = 40;
        const RENDER_DISTANCE = 2; // Keep low for Android performance
        const chunks = new Map();

        function getChunkKey(x, z) {
            return `${x},${z}`;
        }

        function createTerrainChunk(chunkX, chunkZ) {
            const geometry = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, 10, 10);
            geometry.rotateX(-Math.PI / 2);

            // Generate simple procedural height mapping
            const pos = geometry.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i) + chunkX * CHUNK_SIZE;
                const vz = pos.getZ(i) + chunkZ * CHUNK_SIZE;
                const vy = Math.sin(vx * 0.05) * Math.cos(vz * 0.05) * 2; // Simple hill formula
                pos.setY(i, vy);
            }
            geometry.computeVertexNormals();

            const material = new THREE.MeshLambertMaterial({ color: 0x3b7a3b, wireframe: false });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(chunkX * CHUNK_SIZE, 0, chunkZ * CHUNK_SIZE);
            scene.add(mesh);

            return mesh;
        }

        function updateTerrain() {
            const currentChunkX = Math.floor(playerGroup.position.x / CHUNK_SIZE);
            const currentChunkZ = Math.floor(playerGroup.position.z / CHUNK_SIZE);

            const activeKeys = new Set();

            for (let x = -RENDER_DISTANCE; x <= RENDER_DISTANCE; x++) {
                for (let z = -RENDER_DISTANCE; z <= RENDER_DISTANCE; z++) {
                    const cx = currentChunkX + x;
                    const cz = currentChunkZ + z;
                    const key = getChunkKey(cx, cz);
                    activeKeys.add(key);

                    if (!chunks.has(key)) {
                        chunks.set(key, createTerrainChunk(cx, cz));
                    }
                }
            }

            // Unload distant terrain to free up mobile memory
            for (let [key, chunkMesh] of chunks.entries()) {
                if (!activeKeys.has(key)) {
                    scene.remove(chunkMesh);
                    chunkMesh.geometry.dispose();
                    chunkMesh.material.dispose();
                    chunks.delete(key);
                }
            }
        }

        // --- 4. TOUCH JOYSTICK CONTROLLER ---
        let joystickInput = { x: 0, y: 0 };
        const joystick = document.getElementById('joystick-container');
        const knob = document.getElementById('joystick-knob');
        let touchId = null;

        joystick.addEventListener('touchstart', (e) => {
            touchId = e.changedTouches[0].identifier;
            handleJoystickMove(e.changedTouches[0]);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (touchId === null) return;
            for (let touch of e.changedTouches) {
                if (touch.identifier === touchId) {
                    handleJoystickMove(touch);
                }
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === touchId) {
                    touchId = null;
                    knob.style.top = '35px';
                    knob.style.left = '35px';
                    joystickInput = { x: 0, y: 0 };
                }
            }
        }, { passive: true });

        function handleJoystickMove(touch) {
            const rect = joystick.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let deltaX = touch.clientX - centerX;
            let deltaY = touch.clientY - centerY;
            const distance = Math.min(Math.hypot(deltaX, deltaY), 45);

            const angle = Math.atan2(deltaY, deltaX);
            const moveX = Math.cos(angle) * distance;
            const moveY = Math.sin(angle) * distance;

            knob.style.left = `${35 + moveX}px`;
            knob.style.top = `${35 + moveY}px`;

            joystickInput.x = moveX / 45; // Normalized (-1 to 1)
            joystickInput.y = moveY / 45;
        }

        // --- 5. GAME LOOP & MOVEMENT ---
        const moveSpeed = 0.15;
        function animate() {
            requestAnimationFrame(animate);

            if (Math.abs(joystickInput.x) > 0.1 || Math.abs(joystickInput.y) > 0.1) {
                // Rotate player towards movement direction
                const angle = Math.atan2(-joystickInput.x, -joystickInput.y);
                playerGroup.rotation.y = angle;

                // Move player forward
                playerGroup.translateZ(-moveSpeed);

                // Update world streaming
                updateTerrain();
            }

            renderer.render(scene, camera);
        }

        // Adjust canvas on window resize / orientation change
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize world
        updateTerrain();
        animate();
    </script>
</body>
</html>
